{% extends 'base.html' %}
{% load static %}

{% block title %} Reset Password - HEADQUARTER {% endblock %}

{% block content %}
<div class="container-xxl py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="wow fadeInUp" data-wow-delay="0.2s">
                    <div class="bg-dark rounded p-5 shadow-lg border border-secondary">
                        <div class="text-center mb-4">
                            <i class="fa fa-lock-open fa-3x text-primary mb-3"></i>
                            <h2 class="text-white">Forgot Password?</h2>
                            <p class="text-white-50">Don't worry! Enter your registered email below to receive a reset link.</p>
                        </div>
                        
                        <form method="POST">
                            {% csrf_token %}
                            <div class="form-floating mb-4">
                                <input type="email" name="email" autocomplete="email" maxlength="254" required 
                                       class="form-control bg-transparent text-white border-secondary" 
                                       id="id_email" placeholder="name@example.com">
                                <label for="id_email" class="text-secondary">Email Address</label>
                            </div>
                            
                            <button class="btn btn-primary w-100 py-3 rounded-pill fw-bold text-uppercase" type="submit">
                                Send Reset Link <i class="fa fa-paper-plane ms-2"></i>
                            </button>
                        </form>

                        <div class="text-center mt-4">
                            <a href="{% url 'login' %}" class="text-primary text-decoration-none small">
                                <i class="fa fa-arrow-left me-1"></i> Back to Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .form-control:focus {
        background-color: rgba(255, 255, 255, 0.05) !important;
        border-color: #FEA116 !important;
        box-shadow: none;
        color: white !important;
    }
</style>
{% endblock %}
